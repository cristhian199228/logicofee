apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Acceso directo a MySQL para ver procesos activos y consultas lentas
  - name: MySQL LogiCoffee
    uid: mysql
    type: mysql
    url: mysql:3306
    user: root
    jsonData:
      database: performance_schema
    secureJsonData:
      password: $DB_PASSWORD
