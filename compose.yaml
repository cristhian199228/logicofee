services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - meilisearch
            - mailpit
            - selenium
    mysql:
        image: 'mysql:8.4'
        # Primario de la replicación: binlog + GTID para que la réplica se
        # sincronice por posición automática (SOURCE_AUTO_POSITION).
        command:
            - '--server-id=1'
            - '--log-bin=mysql-bin'
            - '--gtid-mode=ON'
            - '--enforce-gtid-consistency=ON'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
            - './docker/mysql/my.cnf:/etc/mysql/conf.d/logicoffee.cnf:ro'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mysql-replica:
        image: 'mysql:8.4'
        # Secundario de solo lectura: recibe los cambios del primario por GTID.
        command:
            - '--server-id=2'
            - '--gtid-mode=ON'
            - '--enforce-gtid-consistency=ON'
            - '--read-only=1'
        ports:
            - '${FORWARD_DB_REPLICA_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql-replica:/var/lib/mysql'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
            MEILI_UPGRADE_DB: '${MEILISEARCH_UPGRADE_DB:-true}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - sail
    prometheus:
        image: 'prom/prometheus:v3.5.0'
        ports:
            - '${FORWARD_PROMETHEUS_PORT:-9090}:9090'
        volumes:
            - './docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
            - 'sail-prometheus:/prometheus'
        networks:
            - sail
        depends_on:
            - cadvisor
            - mysqld-exporter
    cadvisor:
        image: 'ghcr.io/google/cadvisor:v0.53.0'
        privileged: true
        devices:
            - '/dev/kmsg:/dev/kmsg'
        volumes:
            - '/:/rootfs:ro'
            - '/var/run:/var/run:ro'
            - '/sys:/sys:ro'
            - '/var/lib/docker/:/var/lib/docker:ro'
            - '/dev/disk/:/dev/disk:ro'
        networks:
            - sail
    mysqld-exporter:
        image: 'prom/mysqld-exporter:v0.17.2'
        command:
            - '--mysqld.address=mysql:3306'
            - '--mysqld.username=root'
        environment:
            MYSQLD_EXPORTER_PASSWORD: '${DB_PASSWORD}'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
    grafana:
        image: 'grafana/grafana:12.2.0'
        ports:
            - '${FORWARD_GRAFANA_PORT:-3000}:3000'
        environment:
            GF_SECURITY_ADMIN_USER: '${GRAFANA_USER:-admin}'
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_PASSWORD:-admin}'
            GF_USERS_DEFAULT_LANGUAGE: 'es-ES'
            DB_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - './docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro'
            - './docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro'
            - 'sail-grafana:/var/lib/grafana'
        networks:
            - sail
        depends_on:
            - prometheus
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-mysql-replica:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
    sail-prometheus:
        driver: local
    sail-grafana:
        driver: local
